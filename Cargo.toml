[package]
name = "ferris-watch"
version = "0.0.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
prometheus = "0.13.4"
log = "0.4.22"
env_logger = "0.10"
futures = "0.3"
clap = "3.0"
sysinfo = { version = "0.35.2", features = ["default", "disk", "network"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ureq = "2.0"
regex = "1.5"
netstat-esr = "0.8.1"
dirs = "5.0.1"
log4rs = "1.2.0"
ribir = { version = "0.3.0"} # Default feature for Ribir
winit = "0.29" # Add winit as a direct dependency
chrono = "0.4"
semver = "1.0" # Add semver crate
ping = "0.5.0"
lazy_static = "1.4.0"
getrandom = "=0.2.16"
network-interface = "=2.0.1"
reqwest = { version = "0.12.4", features = ["json", "rustls-tls"], default-features = false }
url = "2.5.7"
rustls = "0.21"
rustls-pki-types = "0.1"
x509-parser = "0.15"
webpki-roots = "0.25"
anyhow = "1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["process"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.50.0"
winapi = { version = "=0.3.9", features = ["processthreadsapi", "winbase"] }
windows-sys = { version = "0.52.0", features = ["Win32_System_SystemInformation",
"Win32_NetworkManagement_IpHelper",
"Win32_Foundation","Win32_NetworkManagement_Ndis","Win32_Networking_WinSock",
"Win32_System_EventLog"] }

[profile.release]
strip = "symbols"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
