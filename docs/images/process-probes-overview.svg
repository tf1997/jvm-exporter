<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ferris-watch process and probes dashboard preview</title>
  <desc id="desc">Example process and network probe monitoring snapshot using ferris-watch metrics.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f4f6f8; }
    .label { fill: #aeb7bf; font-size: 13px; }
    .metric { fill: #7f8a93; font-size: 11px; }
    .value { font-size: 29px; font-weight: 650; }
    .panel-title { font-size: 15px; font-weight: 600; }
    .axis { fill: #7f8a93; font-size: 10px; }
    .grid { stroke: #2b3035; stroke-width: 1; }
  </style>
  <rect width="1200" height="675" fill="#101214"/>
  <rect x="0" y="0" width="1200" height="72" fill="#171a1d"/>
  <rect x="0" y="71" width="1200" height="1" fill="#2a3035"/>
  <text x="32" y="31" font-size="13" fill="#4ec9a5" font-weight="650">ferris-watch</text>
  <text x="32" y="54" font-size="21" font-weight="650">Processes and Probes</text>
  <rect x="884" y="19" width="157" height="34" rx="4" fill="#20252a" stroke="#343b42"/>
  <text x="899" y="40" class="label">job: production</text>
  <rect x="1054" y="19" width="46" height="34" rx="4" fill="#20252a" stroke="#343b42"/>
  <text x="1069" y="40" class="label">1h</text>
  <rect x="1114" y="24" width="54" height="24" rx="4" fill="#18372f"/>
  <text x="1123" y="40" font-size="11" fill="#66d7b3" font-weight="650">DEMO</text>

  <g>
    <rect x="32" y="92" width="270" height="92" rx="6" fill="#191c1f" stroke="#2b3137"/>
    <text x="50" y="119" class="label">Processes online</text>
    <text x="50" y="157" class="value" fill="#4ec9a5">8 / 8</text>
    <text x="163" y="157" class="metric">process_online_status</text>
  </g>
  <g>
    <rect x="320" y="92" width="270" height="92" rx="6" fill="#191c1f" stroke="#2b3137"/>
    <text x="338" y="119" class="label">Probe success</text>
    <text x="338" y="157" class="value" fill="#4ec9a5">12 / 12</text>
    <text x="466" y="157" class="metric">probe_*_success</text>
  </g>
  <g>
    <rect x="608" y="92" width="270" height="92" rx="6" fill="#191c1f" stroke="#2b3137"/>
    <text x="626" y="119" class="label">P95 HTTP latency</text>
    <text x="626" y="153" class="value" fill="#f5a65b">118 ms</text>
    <text x="626" y="173" font-size="9" fill="#7f8a93">probe_http_duration_seconds</text>
  </g>
  <g>
    <rect x="896" y="92" width="272" height="92" rx="6" fill="#191c1f" stroke="#2b3137"/>
    <text x="914" y="119" class="label">Earliest certificate</text>
    <text x="914" y="153" class="value" fill="#e5ce73">84 days</text>
    <text x="914" y="173" font-size="9" fill="#7f8a93">probe_http_ssl_earliest_cert_expiry</text>
  </g>

  <g>
    <rect x="32" y="202" width="550" height="260" rx="6" fill="#191c1f" stroke="#2b3137"/>
    <text x="52" y="229" class="panel-title">Process CPU ranking</text>
    <text x="52" y="249" class="metric">process_cpu_usage{process_name, pid}</text>
    <text x="52" y="285" class="label">orders-api</text><rect x="178" y="273" width="302" height="16" rx="3" fill="#272c31"/><rect x="178" y="273" width="249" height="16" rx="3" fill="#f5a65b"/><text x="500" y="285" class="axis">82.5%</text>
    <text x="52" y="327" class="label">payments-api</text><rect x="178" y="315" width="302" height="16" rx="3" fill="#272c31"/><rect x="178" y="315" width="163" height="16" rx="3" fill="#64a8e8"/><text x="500" y="327" class="axis">54.1%</text>
    <text x="52" y="369" class="label">catalog-api</text><rect x="178" y="357" width="302" height="16" rx="3" fill="#272c31"/><rect x="178" y="357" width="107" height="16" rx="3" fill="#4ec9a5"/><text x="500" y="369" class="axis">35.4%</text>
    <text x="52" y="411" class="label">search-worker</text><rect x="178" y="399" width="302" height="16" rx="3" fill="#272c31"/><rect x="178" y="399" width="70" height="16" rx="3" fill="#4ec9a5"/><text x="500" y="411" class="axis">23.2%</text>
    <line x1="178" y1="438" x2="480" y2="438" class="grid"/><text x="178" y="451" class="axis">0%</text><text x="462" y="451" class="axis">100%</text>
  </g>

  <g>
    <rect x="600" y="202" width="568" height="260" rx="6" fill="#191c1f" stroke="#2b3137"/>
    <text x="620" y="229" class="panel-title">Probe latency</text>
    <text x="620" y="249" class="metric">probe_tcp_duration_seconds / probe_http_duration_seconds</text>
    <line x1="642" y1="282" x2="1142" y2="282" class="grid"/>
    <line x1="642" y1="326" x2="1142" y2="326" class="grid"/>
    <line x1="642" y1="370" x2="1142" y2="370" class="grid"/>
    <line x1="642" y1="414" x2="1142" y2="414" class="grid"/>
    <text x="616" y="286" class="axis">200ms</text><text x="622" y="330" class="axis">150ms</text><text x="622" y="374" class="axis">100ms</text><text x="628" y="418" class="axis">50ms</text>
    <polyline points="642,399 676,392 710,395 744,380 778,386 812,375 846,379 880,364 914,371 948,360 982,368 1016,348 1050,357 1084,344 1118,353 1142,342" fill="none" stroke="#64a8e8" stroke-width="2.5"/>
    <polyline points="642,370 676,359 710,366 744,345 778,354 812,339 846,349 880,330 914,341 948,321 982,337 1016,316 1050,328 1084,312 1118,322 1142,309" fill="none" stroke="#f5a65b" stroke-width="2.5"/>
    <circle cx="645" cy="442" r="4" fill="#64a8e8"/><text x="656" y="446" class="axis">TCP</text><circle cx="707" cy="442" r="4" fill="#f5a65b"/><text x="718" y="446" class="axis">HTTP</text>
    <text x="642" y="459" class="axis">10:00</text><text x="868" y="459" class="axis">10:30</text><text x="1107" y="459" class="axis">11:00</text>
  </g>

  <g>
    <rect x="32" y="480" width="1136" height="163" rx="6" fill="#191c1f" stroke="#2b3137"/>
    <text x="52" y="507" class="panel-title">Endpoint status</text>
    <text x="52" y="527" class="metric">probe_tcp_success  probe_ping_success  probe_http_success  process_online_status</text>
    <text x="52" y="559" class="label">orders-api</text><text x="250" y="559" class="label">payments-api</text><text x="468" y="559" class="label">api.example.com</text><text x="726" y="559" class="label">db.internal:5432</text><text x="1002" y="559" class="label">icmp gateway</text>
    <circle cx="130" cy="594" r="10" fill="#4ec9a5"/><text x="126" y="599" font-size="12" fill="#101214" font-weight="700">1</text>
    <circle cx="350" cy="594" r="10" fill="#4ec9a5"/><text x="346" y="599" font-size="12" fill="#101214" font-weight="700">1</text>
    <circle cx="589" cy="594" r="10" fill="#4ec9a5"/><text x="585" y="599" font-size="12" fill="#101214" font-weight="700">1</text>
    <circle cx="850" cy="594" r="10" fill="#4ec9a5"/><text x="846" y="599" font-size="12" fill="#101214" font-weight="700">1</text>
    <circle cx="1108" cy="594" r="10" fill="#4ec9a5"/><text x="1104" y="599" font-size="12" fill="#101214" font-weight="700">1</text>
    <text x="52" y="625" class="axis">Green = healthy endpoint or process. Failed probes also expose status code, certificate lifetime, and failure phase labels.</text>
  </g>
  <text x="1168" y="663" text-anchor="end" class="axis">Representative snapshot using ferris-watch metrics</text>
</svg>
